<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>myCV.com | My CVs</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Design -->
  <link rel="stylesheet" href="style.css">

  <!-- Behaviour -->
  <script src="script.js"></script>
</head>
<body>

  <!-- Top bar -->
  <header class="navbar">
    <a href="index.html" class="logo">my<span>CV</span>.com</a>
    <div class="nav-actions">
      <a href="mycvs.html" class="login-btn folder-btn current">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4.6l2 2.2h8.4A1.5 1.5 0 0 1 21 8.7v8.8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/></svg>
        My CVs
      </a>
      <a href="index.html" class="login-btn" data-signout>Sign Out</a>
    </div>
  </header>

  <main class="mycvs">

    <div class="tpl-intro">
      <div class="tagline">Your folder</div>
      <h1>My <em>CVs</em></h1>
      <div class="divider"></div>
      <p>Every CV you save is kept here. Edit one, download it, or start a new one.</p>
    </div>

    <!-- script.js fills this with one card per saved CV -->
    <div class="cv-grid" id="cv-grid"></div>

    <p class="mycvs-note">Your CVs are saved in this browser on this device. They will follow your account once the website is connected to a server.</p>

  </main>

  <!-- Footer -->
  <footer class="footer">
    &copy; <span id="year">2026</span> myCV.com. All rights reserved.
  </footer>

</body>
</html>
